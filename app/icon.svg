  <line x1="50" y1="24" x2="50" y2="76" stroke="#232733" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Letter A (Left - Stark Crisp White) -->
  <line x1="33" y1="72" x2="42" y2="30" stroke="#F4F5F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="42" y1="30" x2="49.5" y2="52" stroke="#F4F5F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="35.5" y1="62" x2="47" y2="62" stroke="#F4F5F7" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="42" cy="29" r="2.2" fill="#F4F5F7"/>

  <!-- Letter W (Right - Cadmium Amber Signal) -->
  <line x1="51.5" y1="30" x2="55.5" y2="72" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="55.5" y1="72" x2="60.5" y2="46" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="60.5" y1="46" x2="65" y2="72" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="65" y1="72" x2="69" y2="30" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51.5" cy="29" r="2.2" fill="#F59E0B"/>
  <circle cx="69" cy="29" r="2.2" fill="#F59E0B"/>

