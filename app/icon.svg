  <circle cx="50" cy="50" r="38" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.6"/>
  <circle cx="50" cy="50" r="34" stroke="#232733" stroke-width="1"/>

  <!-- Cardinal Tick Marks -->
  <line x1="50" y1="5" x2="50" y2="12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="88" x2="50" y2="95" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="50" x2="12" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="50" x2="95" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Diagonal Micro Ticks -->
  <line x1="22" y1="22" x2="26" y2="26" stroke="#232733" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="22" x2="74" y2="26" stroke="#232733" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="78" x2="26" y2="74" stroke="#232733" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="78" x2="74" y2="74" stroke="#232733" stroke-width="1.2" stroke-linecap="round"/>

