<svg width="500" height="500" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AW Logo — Abdelrhaman Wael</title>
  <desc>Bold modern circular logo with large A and W initials — blue and white</desc>

  <style>
    .bg { fill: #060d1f; }
    .ring1 { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .ring2 { fill: none; stroke: #3b82f6; stroke-width: 1; opacity: 0.4; }
    .inner-bg { fill: #0c1a35; }
    .letter-a { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .letter-w { fill: none; stroke: #3b82f6; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .dot-a { fill: #ffffff; }
    .dot-w { fill: #60a5fa; }
    .divider-line { stroke: #2563eb; stroke-width: 1.5; stroke-linecap: round; }
    .center-dot { fill: #2563eb; }
    .name-text { fill: #cbd5e1; font-family: Arial, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 6px; }
    .tag-text { fill: #3b82f6; font-family: Arial, sans-serif; font-size: 10px; font-weight: 400; letter-spacing: 5px; }
    .tick { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; }
  </style>

  <!-- Background -->
  <rect class="bg" width="680" height="420" rx="16"/>

  <!-- Outer rings -->
  <circle cx="340" cy="190" r="150" class="ring2"/>
  <circle cx="340" cy="190" r="135" class="ring1"/>

  <!-- Tick marks -->
  <g class="tick">
    <line x1="340" y1="51" x2="340" y2="67"/>
    <line x1="340" y1="313" x2="340" y2="329"/>
    <line x1="201" y1="190" x2="217" y2="190"/>
    <line x1="463" y1="190" x2="479" y2="190"/>
    <line x1="245" y1="94" x2="256" y2="107"/>
    <line x1="424" y1="94" x2="435" y2="107"/>
    <line x1="245" y1="286" x2="256" y2="273"/>
    <line x1="424" y1="286" x2="435" y2="273"/>
  </g>

  <!-- Inner circle -->
  <circle cx="340" cy="190" r="115" class="inner-bg" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Vertical center divider -->
  <line x1="340" y1="105" x2="340" y2="275" class="divider-line" opacity="0.3"/>

  <!-- Letter A — bold, left side -->
  <line x1="285" y1="258" x2="312" y2="130" class="letter-a"/>
  <line x1="312" y1="130" x2="336" y2="190" class="letter-a"/>
  <line x1="289" y1="228" x2="327" y2="228" class="letter-a"/>
  <circle cx="312" cy="127" r="5" class="dot-a"/>

  <!-- Letter W — bold, right side -->
  <line x1="344" y1="130" x2="354" y2="248" class="letter-w"/>
  <line x1="354" y1="248" x2="368" y2="178" class="letter-w"/>
  <line x1="368" y1="178" x2="382" y2="248" class="letter-w"/>
  <line x1="382" y1="248" x2="392" y2="130" class="letter-w"/>
  <circle cx="344" cy="127" r="5" class="dot-w"/>
  <circle cx="392" cy="127" r="5" class="dot-w"/>

  <!-- Center dot -->
  <circle cx="340" cy="190" r="5" class="center-dot"/>

  <!-- Bottom section -->
  <line x1="250" y1="315" x2="430" y2="315" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.6"/>

  <text x="340" y="342" class="name-text" text-anchor="middle">ABDELRHAMAN WAEL</text>
  <text x="340" y="364" class="tag-text" text-anchor="middle">DEVELOPER · AI ENGINEER</text>

  <circle cx="318" cy="382" r="2" fill="#1d4ed8" opacity="0.5"/>
  <circle cx="340" cy="382" r="3" fill="#3b82f6"/>
  <circle cx="362" cy="382" r="2" fill="#1d4ed8" opacity="0.5"/>

</svg>
